<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <!-- Road lines -->
  <rect x="0" y="580" width="1200" height="50" fill="#1E293B"/>
  <rect x="0" y="575" width="1200" height="8" fill="#F59E0B" opacity="0.4"/>
  <!-- Dashed center line -->
  <rect x="0" y="600" width="80" height="6" rx="3" fill="#F59E0B" opacity="0.3"/>
  <rect x="120" y="600" width="80" height="6" rx="3" fill="#F59E0B" opacity="0.3"/>
  <rect x="240" y="600" width="80" height="6" rx="3" fill="#F59E0B" opacity="0.3"/>
  <rect x="360" y="600" width="80" height="6" rx="3" fill="#F59E0B" opacity="0.3"/>
  <rect x="480" y="600" width="80" height="6" rx="3" fill="#F59E0B" opacity="0.3"/>
  <rect x="600" y="600" width="80" height="6" rx="3" fill="#F59E0B" opacity="0.3"/>
  <rect x="720" y="600" width="80" height="6" rx="3" fill="#F59E0B" opacity="0.3"/>
  <rect x="840" y="600" width="80" height="6" rx="3" fill="#F59E0B" opacity="0.3"/>
  <rect x="960" y="600" width="80" height="6" rx="3" fill="#F59E0B" opacity="0.3"/>
  <rect x="1080" y="600" width="80" height="6" rx="3" fill="#F59E0B" opacity="0.3"/>
  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="white" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="580" fill="url(#dots)"/>
  <!-- Glow orb left -->
  <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
  </radialGradient>
  <ellipse cx="200" cy="300" rx="300" ry="300" fill="url(#glow1)"/>
  <!-- Logo hexagon -->
  <polygon points="100,80 148,107 148,161 100,188 52,161 52,107" fill="#F59E0B"/>
  <!-- Truck in hex -->
  <rect x="62" y="128" width="32" height="18" rx="2" fill="#0F172A"/>
  <path d="M94 132 L94 146 L108 146 L108 138 L104 132 Z" fill="#0F172A"/>
  <path d="M96 134 L96 137 L107 137 L107 134 L104 131 Z" fill="#F59E0B" opacity="0.7"/>
  <circle cx="71" cy="147" r="5" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="71" cy="147" r="2" fill="#F59E0B"/>
  <circle cx="97" cy="147" r="5" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="97" cy="147" r="2" fill="#F59E0B"/>
  <!-- Brand name under hex -->
  <text x="100" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#F59E0B" letter-spacing="1.5">THE MAN &amp; TRUCK</text>
  <!-- Main headline -->
  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white" letter-spacing="-1">Your Load.</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#F59E0B" letter-spacing="-1">Our Mission.</text>
  <!-- Sub tagline -->
  <text x="640" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="white" opacity="0.7" letter-spacing="0.5">One Call. One Truck. Done.</text>
  <!-- Badges row -->
  <rect x="340" y="410" width="160" height="34" rx="17" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
  <text x="420" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#F59E0B" font-weight="700">🤖 AI-Powered</text>
  <rect x="520" y="410" width="160" height="34" rx="17" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
  <text x="600" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#F59E0B" font-weight="700">🚚 Human Driven</text>
  <rect x="700" y="410" width="160" height="34" rx="17" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
  <text x="780" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#F59E0B" font-weight="700">✓ Verified Drivers</text>
  <!-- URL -->
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.4" letter-spacing="2">THEMANANDTRUCK.COM</text>
</svg>
